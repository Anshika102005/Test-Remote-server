[project]
name = "test-remote-server"
version = "0.1.0"
description = "Expense tracker FastMCP server"
readme = "README.md"
authors = [
    { name = "Anshika102005", email = "anshikasahu3234@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastmcp>=4.1.3",
]

[project.scripts]
test-remote-server = "test_remote_server:main"

[build-system]
requires = ["uv_build>=0.13.3,<0.14.0"]
build-backend = "uv_build"
